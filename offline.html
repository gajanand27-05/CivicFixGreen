<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | EcoSort</title>
  <link rel="icon" type="image/png" href="assets/ecosort-favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFFFF;
      --text-color: #1F2D24;
      --text-muted: #5F6F65;
      --primary: #1E7B34;
      --primary-hover: #17652A;
      --border: #E3EFE6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 440px;
      padding: clamp(28px, 6vw, 40px) clamp(20px, 5vw, 32px);
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(30, 123, 52, 0.10);
    }
    .logo { width: 180px; max-width: 70%; height: auto; display: block; margin: 0 auto 20px; }
    h1 { font-size: clamp(20px, 5vw, 24px); font-weight: 700; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin: 0 0 28px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; padding: 12px 24px;
      font: 600 15px 'Plus Jakarta Sans', sans-serif;
      background: var(--primary); color: #fff;
      border: none; border-radius: 12px; cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/ecosort-logo.png" alt="EcoSort" class="logo">
    <h1>You're offline</h1>
    <p>EcoSort needs a connection to send your complaint. Check your internet and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
