<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSort | Report Garbage Dumps to BBMP</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/ecosort-favicon.png">
  <link rel="apple-touch-icon" href="assets/ecosort-icon-192.png">

  <!-- PWA manifest & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E7B34">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheets -->
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="stylesheet" href="css/citizen.css?v=11">
  <link rel="stylesheet" href="css/officer.css?v=11">
  
  <!-- Leaflet CSS Fallback -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
</head>
<body>

  <!-- App Layout Wrapper -->
  <div class="app-layout">
    
    <!-- DESKTOP TOP NAV BAR (WEBSITE HEADER) -->
    <header class="desktop-header" id="desktop-top-nav">
      <div class="logo-section" onclick="Router.navigate('#/home')">
        <img src="assets/ecosort-logo.png" alt="EcoSort" class="header-logo-img">
      </div>

      <nav class="desktop-nav-links">
        <a href="#/home" class="nav-link"><i data-lucide="home"></i> Home</a>
        <a href="#/map" class="nav-link"><i data-lucide="map"></i> Map</a>
        <a href="#/public" class="nav-link"><i data-lucide="bar-chart-2"></i> City Board</a>
        <a href="#/leaderboard" class="nav-link"><i data-lucide="trophy"></i> Leaderboard</a>
        <a href="#/report" class="nav-link"><i data-lucide="plus-circle"></i> Report</a>
      </nav>

      <div class="desktop-actions">
        <!-- Notification bell -->
        <button class="icon-btn" id="notif-bell" title="Notifications">
          <i data-lucide="bell"></i>
          <span class="badge" id="notif-badge" style="display: none;">0</span>
        </button>

        <!-- Dynamic Login/Avatar container -->
        <div id="desktop-auth-btn">
          <button class="btn btn-outline btn-sm" onclick="Router.navigate('#/login')">Sign In</button>
          <button class="btn btn-primary btn-sm" onclick="Router.navigate('#/signup')">Sign Up</button>
        </div>
      </div>
    </header>

    <!-- MOBILE HEADER BAR -->
    <header class="mobile-header">
      <div class="logo-section" onclick="Router.navigate('#/home')">
        <img src="assets/ecosort-logo.png" alt="EcoSort" class="header-logo-img">
      </div>
      <div class="mobile-actions">
        <button class="icon-btn" id="notif-bell-mobile" title="Notifications">
          <i data-lucide="bell"></i>
          <span class="badge" id="notif-badge-mobile" style="display: none;">0</span>
        </button>
        <div id="mobile-auth-btn"></div>
      </div>
    </header>

    <!-- MAIN APP ROUTED CONTENT CONTAINER -->
    <main class="app-content" id="main-content">
      <div class="loader-container">
        <div class="spinner"></div>
      </div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav class="mobile-nav-bar" id="mobile-bottom-nav">
      <a href="#/home" class="nav-item">
        <i data-lucide="home"></i>
        <span>Home</span>
      </a>
      <a href="#/report" class="nav-item">
        <i data-lucide="plus-circle"></i>
        <span>Report</span>
      </a>
      <a href="#/map" class="nav-item">
        <i data-lucide="map"></i>
        <span>Map</span>
      </a>
      <a href="#/leaderboard" class="nav-item">
        <i data-lucide="trophy"></i>
        <span>Ranks</span>
      </a>
      <a href="#/profile" class="nav-item">
        <i data-lucide="user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Notification Bell overlay list drawer -->
  <div class="notification-overlay-box card" id="notification-overlay">
    <div class="overlay-header">
      <h4>Notifications</h4>
      <button class="overlay-close-btn" type="button" aria-label="Close notifications" onclick="document.getElementById('notification-overlay').classList.remove('active')">&times;</button>
    </div>
    <div class="notifications-list" id="notifications-list">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Toast alerts container -->
  <div class="toast-container" id="toast-container"></div>

  <script>window.googleMapsFailed = true;</script>

  <!-- Leaflet JS Fallbacks -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <!-- Chart.js for operational dashboard charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jsPDF for transparent monthly report compilation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- EXIF GPS reader for uploaded photos -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>

  <!-- APPLICATION CODE FILES -->
  <script src="js/config.js?v=11"></script>
  <script src="js/categories.js?v=11"></script>
  <script src="js/db.js?v=11"></script>
  <script src="js/auth.js?v=11"></script>
  <script src="js/ai.js?v=11"></script>
  <script src="js/router.js?v=11"></script>

  <!-- ROUTE CONTROLLERS -->
  <script src="js/pages/splash.js?v=11"></script>
  <script src="js/pages/login.js?v=11"></script>
  <script src="js/pages/signup.js?v=11"></script>
  <script src="js/pages/home.js?v=11"></script>
  <script src="js/pages/report.js?v=11"></script>
  <script src="js/pages/map.js?v=11"></script>
  <script src="js/pages/leaderboard.js?v=11"></script>
  <script src="js/pages/profile.js?v=11"></script>
  <script src="js/pages/dashboard.js?v=11"></script>
  <script src="js/pages/admin.js?v=11"></script>
  <script src="js/pages/public.js?v=11"></script>

  <!-- COORDINATOR ENTRYPOINT -->
  <script src="js/app.js?v=11"></script>
</body>
</html>
